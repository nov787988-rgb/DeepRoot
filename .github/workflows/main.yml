name: Build DeepRoot 2.0 APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract DeepRoot ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname '*.zip' -not -path './.git/*' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No project ZIP found in the repository root."
            exit 1
          fi
          mkdir -p "$GITHUB_WORKSPACE/unpacked"
          unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/unpacked"
          SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/unpacked" -type f -name settings.gradle.kts -print -quit)"
          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle.kts was not found inside the ZIP."
            exit 1
          fi
          PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          if [ ! -f "$PROJECT_DIR/app/build.gradle.kts" ]; then
            echo "ERROR: app/build.gradle.kts was not found."
            exit 1
          fi
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Using project directory: $PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Release APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: gradle -p "$PROJECT_DIR" assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepRoot-2.0-release
          path: unpacked/**/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
