name: Build DeepRoot 2.0 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract DeepRoot project ZIP
        id: project
        shell: bash
        run: |
          set -euo pipefail
          ZIP_FILE="$(find . -maxdepth 2 -type f -iname 'DeepRoot*.zip' -not -path './.git/*' | head -n 1)"
          if [ -z "$ZIP_FILE" ]; then
            echo "找不到 DeepRoot 项目 ZIP，请把 DeepRoot-2.0.zip 上传到仓库根目录。"
            exit 1
          fi
          mkdir -p extracted
          unzip -q "$ZIP_FILE" -d extracted
          PROJECT_DIR="$(find extracted -type f -name settings.gradle.kts -printf '%h\n' | head -n 1)"
          if [ -z "$PROJECT_DIR" ]; then
            echo "ZIP 内未找到 settings.gradle.kts。"
            exit 1
          fi
          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "项目目录：$PROJECT_DIR"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build signed release APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.project_dir }}
        run: gradle -p "$PROJECT_DIR" assembleRelease --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepRoot-2.0-release
          path: ${{ steps.project.outputs.project_dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
