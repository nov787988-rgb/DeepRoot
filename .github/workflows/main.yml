name: Build DeepRoot 2.4.0 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Use the Android SDK already installed on GitHub's Ubuntu runner.
      # This avoids the separate setup-android action failing during bootstrap.
      - name: Prepare Android SDK
        shell: bash
        run: |
          set -Eeuo pipefail
          SDK_DIR="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          if [ ! -d "$SDK_DIR" ]; then
            for candidate in /usr/local/lib/android/sdk "$HOME/Android/Sdk"; do
              if [ -d "$candidate" ]; then SDK_DIR="$candidate"; break; fi
            done
          fi
          if [ ! -d "$SDK_DIR" ]; then
            echo "Android SDK directory not found on runner" >&2
            exit 1
          fi
          SDKMANAGER="$(find "$SDK_DIR/cmdline-tools" -type f -name sdkmanager -print -quit 2>/dev/null || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(command -v sdkmanager || true)"
          fi
          if [ -z "$SDKMANAGER" ]; then
            echo "sdkmanager not found under $SDK_DIR" >&2
            find "$SDK_DIR" -maxdepth 4 -type f | head -80
            exit 1
          fi
          echo "ANDROID_HOME=$SDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_DIR" >> "$GITHUB_ENV"
          echo "$SDK_DIR/platform-tools" >> "$GITHUB_PATH"
          echo "$(dirname "$SDKMANAGER")" >> "$GITHUB_PATH"
          export ANDROID_HOME="$SDK_DIR" ANDROID_SDK_ROOT="$SDK_DIR"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          for attempt in 1 2 3; do
            if "$SDKMANAGER" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"; then
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "Android SDK package installation failed after 3 attempts" >&2
              exit 1
            fi
            sleep $((attempt * 10))
          done
          test -x "$SDK_DIR/build-tools/35.0.0/apksigner"
          test -d "$SDK_DIR/platforms/android-35"

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${GITHUB_WORKSPACE}/settings.gradle.kts" ] && [ -f "${GITHUB_WORKSPACE}/app/build.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$(find . -maxdepth 3 -type f -name 'DeepRoot-2.4.0-Android-Source-New-Signature.zip' -print -quit)"
            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' -print -quit)"
            fi
            if [ -z "$ZIP_FILE" ]; then echo 'Android project or source ZIP not found'; exit 1; fi
            mkdir -p "$GITHUB_WORKSPACE/unpacked"
            unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/unpacked"
            SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/unpacked" -type f -name settings.gradle.kts -print -quit)"
            [ -n "$SETTINGS_FILE" ] || { echo 'settings.gradle.kts not found'; exit 1; }
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi
          test -f "$PROJECT_DIR/app/deeproot-release-2026.jks"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Building from $PROJECT_DIR"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug and signed Release APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" assembleDebug assembleRelease --no-daemon

      - name: Verify Release APK signature
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepRoot-2.4.0-debug
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepRoot-2.4.0-release-signed
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
