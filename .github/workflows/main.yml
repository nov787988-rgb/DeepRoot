name: Build DeepRoot 2.4.0 APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          yes | sdkmanager --licenses >/dev/null || true

      - name: Locate Android project
        id: project
        shell: bash
        run: |
          set -euo pipefail
          if [ -f "${GITHUB_WORKSPACE}/settings.gradle.kts" ] && [ -f "${GITHUB_WORKSPACE}/app/build.gradle.kts" ]; then
            PROJECT_DIR="$GITHUB_WORKSPACE"
          else
            ZIP_FILE="$(find . -maxdepth 3 -type f -name 'DeepRoot-2.4.0-Android-Source-New-Signature.zip' -print -quit)"
            if [ -z "$ZIP_FILE" ]; then
              ZIP_FILE="$(find . -maxdepth 3 -type f -iname '*.zip' -not -path './.git/*' -print -quit)"
            fi
            if [ -z "$ZIP_FILE" ]; then echo 'Android project or source ZIP not found'; exit 1; fi
            mkdir -p "$GITHUB_WORKSPACE/unpacked"
            unzip -q "$ZIP_FILE" -d "$GITHUB_WORKSPACE/unpacked"
            SETTINGS_FILE="$(find "$GITHUB_WORKSPACE/unpacked" -type f -name settings.gradle.kts -print -quit)"
            [ -n "$SETTINGS_FILE" ] || { echo 'settings.gradle.kts not found'; exit 1; }
            PROJECT_DIR="$(dirname "$SETTINGS_FILE")"
          fi
          test -f "$PROJECT_DIR/app/deeproot-release-2026.jks"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"
          echo "Building from $PROJECT_DIR"

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Debug and signed Release APK
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          gradle -p "$PROJECT_DIR" assembleDebug assembleRelease --no-daemon

      - name: Verify Release APK signature
        env:
          PROJECT_DIR: ${{ steps.project.outputs.dir }}
        run: |
          APK="$(find "$PROJECT_DIR/app/build/outputs/apk/release" -name '*.apk' -print -quit)"
          test -n "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepRoot-2.4.0-debug
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload Signed Release APK
        uses: actions/upload-artifact@v4
        with:
          name: DeepRoot-2.4.0-release-signed
          path: ${{ steps.project.outputs.dir }}/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 30
